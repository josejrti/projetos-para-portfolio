<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerador de Senhas</title>
        <meta name="keywords" content="gerar, senha, dificil, grande">
        <meta name="description" content="Gerador de senhas grandes e complexas.">
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Gerador de senhas</h1>
        </header>
        <main>
            <section class="container-input">
                <h2>Tamanho: <span id="valor"></span></h2>
                <input id="slider" class="slider" type="range" min="8" max="128" value="8"/>
                <button id="button" class="button-cta" onclick="generatePassword()">Gerar</button>
            </section>    
            <section id="container-password" onclick="copyPassword()" class="container-password hide">
                <span class="title">Senha Gerada!</span>
                <span id="password"  class="password"></span>
                <span class="tooltip">Clique na senha para copiar</span>
            </section>
        </main>
    </body>
</html>
